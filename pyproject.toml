[project]
name = "bed-time-stories"
version = "0.1.0"
description = "App for generating bed time stories"
readme = "README.md"
authors = [
    { name = "anderssiigdreisig", email = "andersiigdreisig@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bed-time-stories = "bed_time_stories:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
